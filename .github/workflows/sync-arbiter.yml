name: Sync scores from MIAA Arbiter export
# Runs every morning after MIAA's 4 a.m. export and late every evening after games, plus on demand from
# the site's Admin > Sync button (api/sync.js) or the Actions tab. It downloads MIAA's official Arbiter-based
# PDFs, then the live results on MIAA's public scoreboard, runs the tests, and commits to main only if
# anything changed. Vercel deploys the commit.
on:
  schedule:
    - cron: '15 11 * * *'   # 6:15 a.m. Eastern (7:15 a.m. while daylight time lasts)
    - cron: '45 3 * * *'    # 10:45 p.m. Eastern (11:45 p.m. while daylight time lasts)
  workflow_dispatch:
  push:
    paths:
      - 'data/verified-reported-2026.js'
      - 'scripts/sync_live.py'
      - 'scripts/sync_miaa.py'
      - 'scripts/audit_releases.cjs'
      - 'scripts/pending_audit.cjs'
      - 'scripts/accuracy_report.cjs'
      - '.github/workflows/sync-arbiter.yml'
      - 'tests/test_sync_live.py'
concurrency:
  group: sync-arbiter
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pdfplumber>=0.11,<0.13' 'requests>=2.31,<3'
      - name: Keep the current release for the accuracy report
        run: mkdir -p /tmp/previous && cp data/season-2026.js data/fall-2026.js data/live-2026.js /tmp/previous/
      - name: Download and validate MIAA's newest release
        run: python scripts/sync_miaa.py
      - name: Pull live results from MIAA's scoreboard
        run: python scripts/sync_live.py
      - name: Test missing-score retention
        run: python -m unittest discover -s tests -p 'test_sync_live.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test the synced data
        run: node --test tests/*.test.cjs
      - name: Write unresolved score-coverage report
        run: node scripts/pending_audit.cjs
      - name: Summarize what changed in each sport
        run: node scripts/sync_summary.cjs /tmp/previous
      - name: Measure our projection against any new MIAA release
        run: node scripts/accuracy_report.cjs /tmp/previous
      - name: Audit every game and flag corrections from MIAA's prior release
        run: node scripts/audit_releases.cjs /tmp/previous
      - name: Archive the release for formula calibration
        run: python scripts/archive_releases.py --current
      - name: Commit and push if anything changed
        run: |
          git add data/season-2026.js data/fall-2026.js data/live-2026.js
          if [ -f data/accuracy-log.json ]; then git add data/accuracy-log.json; fi
          if [ -f data/reconciliation-log.json ]; then git add data/reconciliation-log.json; fi
          if [ -f data/unresolved-games.json ]; then git add data/unresolved-games.json; fi
          git add data/releases
          if git diff --staged --quiet; then
            echo "No new results since the last sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync MIAA scores ($(date -u '+%Y-%m-%d %H:%M') UTC)"
          # App edits may land on main while a long PDF ingest is processing.
          # Rebase our generated data commit onto the latest main, and retry
          # fast-forward pushes rather than dropping a validated score release.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent update detected; retrying push ($attempt/3)..."
            sleep 5
          done
          echo "Unable to publish the validated score release after 3 attempts." >&2
          exit 1
