name: Validate ratings
on:
  push:
    branches: [main, 'fix/**']
    paths:
      - 'rating-engine.js'
      - 'app.js'
      - 'tournament-rules.js'
      - 'scripts/audit_releases.cjs'
      - 'scripts/accuracy_report.cjs'
      - 'data/**'
      - 'tests/**'
      - '.github/workflows/ratings-validation.yml'
  pull_request:
    paths:
      - 'rating-engine.js'
      - 'app.js'
      - 'tournament-rules.js'
      - 'scripts/audit_releases.cjs'
      - 'scripts/accuracy_report.cjs'
      - 'data/**'
      - 'tests/**'
      - '.github/workflows/ratings-validation.yml'
jobs:
  ratings:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check rating-engine.js
      - run: node --check app.js
      - run: node --check tournament-rules.js
      - run: node --check scripts/audit_releases.cjs
      - run: node --check scripts/accuracy_report.cjs
      - run: node --test tests/*.test.cjs
