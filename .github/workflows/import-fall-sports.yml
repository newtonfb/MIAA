name: Import MIAA Fall 2026 Sports
on:
  push:
    branches: [feature/fall-2026-multisport]
    paths:
      - scripts/build_fall_2026.py
      - .github/workflows/import-fall-sports.yml
  pull_request:
    paths:
      - scripts/build_fall_2026.py
      - .github/workflows/import-fall-sports.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF reader
        run: python -m pip install 'pdfplumber>=0.11,<0.13' 'requests>=2.31,<3'
      - name: Import MIAA October 30 rankings and scores
        run: python scripts/build_fall_2026.py
      - uses: actions/upload-artifact@v4
        with:
          name: fall-2026-dataset
          path: data/fall-2026.js
          retention-days: 7
      - name: Verify dataset and commit back to feature branch
        if: github.event_name == 'push'
        run: |
          test -s data/fall-2026.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fall-2026.js
          if ! git diff --staged --quiet; then
            git commit -m "Import official Oct 30 field hockey, soccer and volleyball data"
            git pull --rebase origin feature/fall-2026-multisport
            git push origin feature/fall-2026-multisport
          fi
